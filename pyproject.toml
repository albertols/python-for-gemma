[project]
name = "python-for-gemma"
version = "0.1.0"
description = "Agentic AI Masters for Education — Gemma's learning repo"
requires-python = ">=3.12"
dependencies = [
    "ai-teacher-planner",
    "automation-flows",
    "ai-homework-companion",
    "ai-examiner",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4", "pre-commit>=3.7"]

[tool.uv.workspace]
members = ["prototypes/*"]
# prototypes/resources is Gemma's local, git-ignored teaching-resource folder,
# not a Python package. Without this, `uv sync` fails on machines that have it.
exclude = ["prototypes/resources"]

[tool.uv.sources]
ai-teacher-planner = { workspace = true }
automation-flows = { workspace = true }
ai-homework-companion = { workspace = true }
ai-examiner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "python_course", "prototypes"]
# Never walk the 5 GB resources folder, the planner's local data, or JS deps.
norecursedirs = [".*", "node_modules", "dist", "build", "resources", "data", "*.egg-info"]
markers = ["homework: Gemma's exercises — excluded from CI, run per-module"]
addopts = "-m 'not homework'"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
