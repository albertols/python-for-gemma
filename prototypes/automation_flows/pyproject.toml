[project]
name = "automation-flows"
version = "0.1.0"
description = "Automation workflows for education tasks"
requires-python = ">=3.12"
dependencies = ["msal>=1.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automation_flows"]
