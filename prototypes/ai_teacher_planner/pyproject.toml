[project]
name = "ai-teacher-planner"
version = "0.1.0"
description = "AI-powered lesson planning and curriculum generation"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_teacher_planner"]
